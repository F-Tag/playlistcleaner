name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format & types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=markdown:coverage.md
      - name: Add coverage report to job summary
        if: always()
        run: |
          if [ -f coverage.md ]; then
            {
              echo "## Coverage"
              echo
              cat coverage.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run bandit
        run: uv run bandit -c pyproject.toml -r src
      - name: Audit dependencies
        run: uv run pip-audit --progress-spinner off --skip-editable
      - name: Audit GitHub Actions workflows
        run: uv run zizmor .github/workflows
