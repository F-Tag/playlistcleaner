[project]
name = "playlistcleaner"
version = "0.1.0"
description = "Clean up music playlists by detecting duplicate tracks."
readme = "README.md"
authors = [
    { name = "Fumiaki Taguchi", email = "25476669+F-Tag@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0.3,<4",
    "pytaglib>=3.2,<4",
    "tqdm>=4.66.3,<5",
]

[project.scripts]
playlistcleaner = "playlistcleaner.cli:main"

[dependency-groups]
dev = [
    "bandit[toml]>=1.7",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.5.7",
    "types-tqdm>=4.70.0.20261106",
    "zizmor>=1.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playlistcleaner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["playlistcleaner"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["taglib"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "W",
    "C4", "C90", "SIM", "PT", "RUF", "PTH", "RET", "ARG", "T20",
    "ISC", "FURB", "PERF", "N", "TRY", "PL",
]
ignore = [
    "E501",    # 行長は formatter に任せる
    "PLR2004", # テストや小さな分岐ではマジックナンバーを許容する
    "RUF001",  # 日本語の全角記号を意図的に使う
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.bandit]
exclude_dirs = [".venv", "output", "archive"]
